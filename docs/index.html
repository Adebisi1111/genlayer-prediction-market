<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimeX — Prediction Markets</title>
<style>
:root{
  --bg:#0a0e14;--panel:#111820;--panel2:#1a2230;--border:#2a3540;
  --butter:#e8c98a;--text:#e6edf3;--muted:#7a8a9a;
  --green:#3fb950;--green-bg:#0d2818;
  --red:#f85149;--red-bg:#2d0a0a;
  --blue:#58a6ff;--blue-bg:#0d1a2d;
  --orange:#f0883e;--orange-bg:#2d1a0d;
  --purple:#a371f7;--purple-bg:#1a0d2d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}

.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.main{display:flex;flex-direction:column;min-height:calc(100vh - 60px)}
.content{flex:1;padding:24px;max-width:1400px;margin:0 auto;width:100%}

.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--butter),#c9a86a);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--bg);font-size:18px}
.logo-text{font-size:20px;font-weight:700}
.logo-badge{font-size:10px;background:var(--blue);color:#fff;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:4px}
.header-right{display:flex;align-items:center;gap:16px}
.addr{font-size:13px;color:var(--butter);font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
.balance{font-size:13px;color:var(--green);font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-primary{background:var(--butter);color:var(--bg)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;font-size:13px;border-radius:6px;cursor:pointer}
.btn-outline:hover{background:var(--panel2)}

.categories{display:flex;gap:8px;overflow-x:auto;padding:4px 0 24px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.cat-btn:hover{border-color:var(--blue);color:var(--text)}
.cat-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.cat-icon{font-size:16px}
.cat-count{font-size:11px;background:var(--panel2);padding:2px 6px;border-radius:10px}
.cat-btn.active .cat-count{background:rgba(255,255,255,.2)}

.hero{padding:40px 0;text-align:center}
.hero h1{font-size:36px;font-weight:800;margin-bottom:12px;background:linear-gradient(135deg,var(--text),var(--butter));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:16px;max-width:500px;margin:0 auto 24px}
.hero-stats{display:flex;justify-content:center;gap:40px;margin-top:32px}
.hero-stat{text-align:center}
.hero-stat-value{font-size:24px;font-weight:700;color:var(--butter)}
.hero-stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:20px;font-weight:700}
.markets{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.market{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;transition:all .15s;cursor:pointer}
.market:hover{border-color:var(--blue);transform:translateY(-2px)}
.market-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.market-category{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.cat-crypto{background:var(--orange-bg);color:var(--orange)}
.cat-sports{background:var(--green-bg);color:var(--green)}
.cat-politics{background:var(--purple-bg);color:var(--purple)}
.cat-news{background:var(--blue-bg);color:var(--blue)}
.cat-entertainment{background:var(--red-bg);color:var(--red)}
.cat-science{background:var(--panel2);color:var(--muted)}
.market-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase}
.status-open{background:var(--green-bg);color:var(--green)}
.status-resolved{background:var(--blue-bg);color:var(--blue)}
.status-settled{background:var(--panel2);color:var(--muted)}
.status-disputed{background:var(--orange-bg);color:var(--orange)}
.market-question{font-size:15px;font-weight:600;margin-bottom:16px;line-height:1.4;min-height:44px}
.market-options{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.market-option{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel2);border-radius:8px;font-size:13px}
.option-name{font-weight:500}
.option-price{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600;color:var(--butter)}
.market-footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)}
.market-pool{font-size:12px;color:var(--muted)}
.market-pool span{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600;color:var(--text)}
.market-end{font-size:11px;color:var(--muted)}

.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:24px;font-weight:700;margin-bottom:24px}
.form-group{margin-bottom:20px}
.form-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;display:block}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px;font-size:14px;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--blue)}
.form-textarea{min-height:100px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-group{display:flex;gap:12px;margin-top:24px}
.btn-group .btn{flex:1}
.btn-cancel{background:var(--panel2);color:var(--text)}

@media(max-width:768px){
  .header{padding:12px 16px;flex-wrap:wrap;gap:12px}
  .header-right{width:100%;justify-content:space-between}
  .hero h1{font-size:28px}
  .markets{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <div class="logo-icon">P</div>
    <span class="logo-text">PrimeX</span>
    <span class="logo-badge">GenLayer</span>
  </div>
  <div class="header-right">
    <span class="balance" id="balance">—</span>
    <span class="addr" id="addr">Not connected</span>
    <button class="btn btn-outline" id="connectBtn" onclick="connect()">Connect Wallet</button>
  </div>
</div>

<main class="main">
  <div class="content">
    <section class="hero">
      <h1>Predict the Future</h1>
      <p>AI-powered prediction markets. Stake GEN on outcomes, verified by decentralized consensus.</p>
      <button class="btn btn-primary" onclick="showCreate()">+ Create Market</button>
      <div class="hero-stats">
        <div class="hero-stat"><div class="hero-stat-value" id="totalMarkets">0</div><div class="hero-stat-label">Markets</div></div>
        <div class="hero-stat"><div class="hero-stat-value" id="totalVolume">0</div><div class="hero-stat-label">Volume (GEN)</div></div>
        <div class="hero-stat"><div class="hero-stat-value" id="activeMarkets">0</div><div class="hero-stat-label">Active</div></div>
      </div>
    </section>

    <div class="categories" id="categories">
      <button class="cat-btn active" onclick="filterCategory('all',this)">🔥 All <span class="cat-count" id="countAll">0</span></button>
      <button class="cat-btn" onclick="filterCategory('crypto',this)">₿ Crypto <span class="cat-count" id="countCrypto">0</span></button>
      <button class="cat-btn" onclick="filterCategory('sports',this)">⚽ Sports <span class="cat-count" id="countSports">0</span></button>
      <button class="cat-btn" onclick="filterCategory('politics',this)">🏛️ Politics <span class="cat-count" id="countPolitics">0</span></button>
      <button class="cat-btn" onclick="filterCategory('news',this)">📰 News <span class="cat-count" id="countNews">0</span></button>
      <button class="cat-btn" onclick="filterCategory('entertainment',this)">🎬 Ent. <span class="cat-count" id="countEnt">0</span></button>
      <button class="cat-btn" onclick="filterCategory('science',this)">🔬 Science <span class="cat-count" id="countScience">0</span></button>
    </div>

    <section>
      <div class="section-header">
        <h2 class="section-title" id="sectionTitle">All Markets</h2>
        <span style="color:var(--muted);font-size:13px" id="marketCount">0 markets</span>
      </div>
      <div class="markets" id="marketsList">
        <div class="empty"><div class="empty-icon">📊</div><div>Loading markets...</div></div>
      </div>
    </section>
  </div>
</main>

<!-- Create Modal -->
<div class="modal-overlay" id="createModal" style="display:none">
  <div class="modal">
    <div class="modal-title">Create Market</div>
    <div class="form-group">
      <label class="form-label">Question</label>
      <input class="form-input" id="qQuestion" placeholder="e.g., Will Bitcoin exceed $100,000 by end of 2026?">
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-input" id="qCategory">
        <option value="crypto">Crypto</option>
        <option value="sports">Sports</option>
        <option value="politics">Politics</option>
        <option value="news">News</option>
        <option value="entertainment">Entertainment</option>
        <option value="science">Science</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Resolution Rules</label>
      <textarea class="form-input form-textarea" id="qRules" placeholder="Describe exactly how the outcome will be determined..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Source URL</label>
      <input class="form-input" id="qSource1" placeholder="https://api.example.com/data">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Option 1</label>
        <input class="form-input" id="qOpt1" value="YES">
      </div>
      <div class="form-group">
        <label class="form-label">Option 2</label>
        <input class="form-input" id="qOpt2" value="NO">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">End Date</label>
      <input class="form-input" type="date" id="qEndDate">
    </div>
    <div class="btn-group">
      <button class="btn btn-cancel" onclick="hideCreate()">Cancel</button>
      <button class="btn btn-primary" onclick="submitCreate()">Create Market</button>
    </div>
  </div>
</div>

<!-- Use ethers.js instead of genlayer-js to avoid viem encoding issues -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
const FACTORY = "0xDD457e0F2FfE7B843f8C90f7997DB06714666CC9";
const RPC = "https://rpc-bradbury.genlayer.com";

// Contract ABI (only the functions we need)
const ABI = [
  "function createMarket(string question, string rules, string marketType, string[] options, string source1, string source2, string source3) returns (string)",
  "function getMarketsPage(uint256 page, uint256 limit) returns (string[] marketIds, string[] questions, string[] statuses, uint256[] totalPools, string[] outcomes, uint256 total)",
  "function getConfig() view returns (uint256 marketCount)",
  "function stake(string marketId, string option) payable"
];

let provider = null, signer = null, contract = null, isConnected = false, currentCategory = "all";

async function connect(){
  const b = document.getElementById("addr"), btn = document.getElementById("connectBtn");
  if(isConnected){
    provider = null; signer = null; contract = null; isConnected = false;
    b.textContent = "Not connected";
    document.getElementById("balance").textContent = "—";
    btn.textContent = "Connect Wallet";
    loadSampleMarkets();
    return;
  }
  try {
    btn.textContent = "Connecting...";
    if(!window.ethereum){ alert("Open in MetaMask browser"); btn.textContent = "Connect Wallet"; return; }
    
    // Request accounts
    const accounts = await window.ethereum.request({method: "eth_requestAccounts"});
    if(!accounts || accounts.length === 0){ alert("No accounts found"); btn.textContent = "Connect Wallet"; return; }
    
    // Create provider and signer
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    contract = new ethers.Contract(FACTORY, ABI, signer);
    
    const address = await signer.getAddress();
    b.textContent = "Connected: " + address;
    btn.textContent = "Connected (tap to disconnect)";
    isConnected = true;
    
    // Get balance
    const bal = await provider.getBalance(address);
    document.getElementById("balance").textContent = parseFloat(ethers.formatEther(bal)).toFixed(4) + " GEN";
    
    loadMarkets();
  } catch(e){ 
    console.error("Connect error:", e);
    b.textContent = "Failed: " + e.message; 
    btn.textContent = "Connect Wallet"; 
  }
}

async function loadMarkets(){
  const el = document.getElementById("marketsList");
  if(!contract){
    loadSampleMarkets();
    return;
  }
  try {
    const result = await contract.getMarketsPage(1, 20);
    const markets = result.markets || [];
    const total = result.total ? Number(result.total) : 0;
    
    if(markets.length === 0){
      el.innerHTML = '<div class="empty"><div class="empty-icon">📊</div><div>No markets yet. Create the first one!</div></div>';
    } else {
      el.innerHTML = markets.map(m => renderMarket(m)).join('');
    }
    document.getElementById("totalMarkets").textContent = total;
    document.getElementById("marketCount").textContent = markets.length + " markets";
  } catch(e){
    console.error("Load error:", e);
    loadSampleMarkets();
  }
}

function renderMarket(m){
  const catClass = {
    'crypto':'cat-crypto','sports':'cat-sports','politics':'cat-politics',
    'news':'cat-news','entertainment':'cat-entertainment','science':'cat-science'
  }[m.category || 'crypto'] || 'cat-crypto';
  const statusClass = {
    'OPEN':'status-open','RESOLVED':'status-resolved','SETTLED':'status-settled','DISPUTED':'status-disputed'
  }[m.status] || 'status-open';
  const pool = (m.totalPool ? Number(ethers.formatEther(m.totalPool)) : 0).toFixed(2);
  const options = m.options || ["YES","NO"];
  return `
    <div class="market" onclick="openMarket('${m.marketId}')">
      <div class="market-header">
        <span class="market-category ${catClass}">${(m.category||'crypto').toUpperCase()}</span>
        <span class="market-status ${statusClass}">${m.status}</span>
      </div>
      <div class="market-question">${m.question}</div>
      <div class="market-options">
        ${options.map((o,i) => `
          <div class="market-option">
            <span class="option-name">${o}</span>
            <span class="option-price">${i===0?'62':i===1?'38':'50'}¢</span>
          </div>
        `).join("")}
      </div>
      <div class="market-footer">
        <span class="market-pool">Pool: <span>${pool} GEN</span></span>
        <span class="market-end">${m.outcome ? '→ '+m.outcome : 'Ends '+ (m.end_date || 'TBD')}</span>
      </div>
    </div>
  `;
}

function openMarket(id){
  alert("Market: " + id + "\n\n(Staking page coming soon)");
}

function filterCategory(cat, btn){
  currentCategory = cat;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const titles = {all:"All Markets",crypto:"Crypto",sports:"Sports",politics:"Politics",news:"News",entertainment:"Entertainment",science:"Science"};
  document.getElementById("sectionTitle").textContent = titles[cat] || "Markets";
  if(contract) loadMarkets(); else loadSampleMarkets();
}

function showCreate(){ document.getElementById("createModal").style.display = "flex"; }
function hideCreate(){ document.getElementById("createModal").style.display = "none"; }

async function submitCreate(){
  if(!isConnected) return alert("Connect wallet first");
  const q = document.getElementById("qQuestion").value;
  const r = document.getElementById("qRules").value;
  const s1 = document.getElementById("qSource1").value;
  const opt1 = document.getElementById("qOpt1").value;
  const opt2 = document.getElementById("qOpt2").value;
  if(!q || q.length < 10) return alert("Question must be at least 10 characters");
  if(!r || r.length < 10) return alert("Rules must be at least 10 characters");
  if(!s1 || !s1.startsWith("http")) return alert("Valid source URL required");
  try {
    const tx = await contract.createMarket(q, r, "BINARY", [opt1, opt2], s1, "", "");
    alert("Market created! Tx: " + tx.hash);
    hideCreate();
    loadMarkets();
  } catch(e) { alert("Error: " + e.message); }
}

// Sample markets for when not connected
const sampleMarkets = [
  {id:"m1",marketId:"market-1",question:"Will Bitcoin exceed $100,000 by end of 2026?",category:"crypto",status:"OPEN",totalPool:1250,end_date:"2026-12-31",options:["Yes","No"]},
  {id:"m2",marketId:"market-2",question:"Will Ethereum exceed $5,000 by end of 2026?",category:"crypto",status:"OPEN",totalPool:890,end_date:"2026-12-31",options:["Yes","No"]},
  {id:"m3",marketId:"market-3",question:"Will Manchester City win the 2026 Premier League?",category:"sports",status:"OPEN",totalPool:2100,end_date:"2026-05-31",options:["Yes","No"]},
  {id:"m4",marketId:"market-4",question:"Will Argentina win the 2026 FIFA World Cup?",category:"sports",status:"RESOLVED",totalPool:3400,end_date:"2026-07-19",outcome:"Yes",options:["Yes","No"]},
  {id:"m5",marketId:"market-5",question:"Will the US Federal Reserve cut rates in Q1 2026?",category:"politics",status:"OPEN",totalPool:560,end_date:"2026-03-31",options:["Yes","No"]},
  {id:"m6",marketId:"market-6",question:"Will Apple release a foldable iPhone by end of 2026?",category:"news",status:"OPEN",totalPool:1800,end_date:"2026-12-31",options:["Yes","No"]},
  {id:"m7",marketId:"market-7",question:"Will Oppenheimer win Best Picture at the 2026 Oscars?",category:"entertainment",status:"OPEN",totalPool:670,end_date:"2026-03-15",options:["Yes","No"]},
  {id:"m8",marketId:"market-8",question:"Will there be a major earthquake (>7.0) in California by 2026?",category:"science",status:"OPEN",totalPool:980,end_date:"2026-12-31",options:["Yes","No"]},
  {id:"m9",marketId:"market-9",question:"Will Solana flip ETH in market cap by 2026?",category:"crypto",status:"OPEN",totalPool:1560,end_date:"2026-12-31",options:["Yes","No"]},
];

function loadSampleMarkets(){
  let markets = currentCategory === "all" ? sampleMarkets : sampleMarkets.filter(m => m.category === currentCategory);
  const el = document.getElementById("marketsList");
  if(markets.length === 0){
    el.innerHTML = '<div class="empty"><div class="empty-icon">📊</div><div>No markets in this category</div></div>';
    return;
  }
  el.innerHTML = markets.map(m => renderMarket(m)).join('');
  document.getElementById("totalMarkets").textContent = sampleMarkets.length;
  document.getElementById("totalVolume").textContent = sampleMarkets.reduce((a,m)=>a+(m.totalPool||0),0).toLocaleString();
  document.getElementById("activeMarkets").textContent = sampleMarkets.filter(m=>m.status==="OPEN").length;
  document.getElementById("marketCount").textContent = markets.length + " markets";
  document.getElementById("countAll").textContent = sampleMarkets.length;
  document.getElementById("countCrypto").textContent = sampleMarkets.filter(m=>m.category==="crypto").length;
  document.getElementById("countSports").textContent = sampleMarkets.filter(m=>m.category==="sports").length;
  document.getElementById("countPolitics").textContent = sampleMarkets.filter(m=>m.category==="politics").length;
  document.getElementById("countNews").textContent = sampleMarkets.filter(m=>m.category==="news").length;
  document.getElementById("countEnt").textContent = sampleMarkets.filter(m=>m.category==="entertainment").length;
  document.getElementById("countScience").textContent = sampleMarkets.filter(m=>m.category==="science").length;
}

window.connect = connect;
window.loadMarkets = loadMarkets;
window.openMarket = openMarket;
window.filterCategory = filterCategory;
window.showCreate = showCreate;
window.hideCreate = hideCreate;
window.submitCreate = submitCreate;

// Initial load
loadSampleMarkets();
</script>
</body>
</html>
