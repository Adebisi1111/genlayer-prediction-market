<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PrimeX — Claim Winnings</title>
<style>
  :root{
    --bg:#0a0e14;--panel:#111820;--panel2:#1a2230;--border:#2a3540;
    --butter:#e8c98a;--text:#e6edf3;--muted:#7a8a9a;
    --green:#3fb950;--green-bg:#0d2818;
    --red:#f85149;--red-bg:#2d0a0a;
    --blue:#58a6ff;--blue-bg:#0d1a2d;
    --orange:#f0883e;--orange-bg:#2d1a0d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}

  .header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:none}
  .back:hover{color:var(--text)}
  .balance{font-size:13px;color:var(--green);font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600}

  .content{max-width:800px;margin:0 auto;padding:24px}

  .page-title{font-size:28px;font-weight:700;margin-bottom:8px}
  .page-sub{color:var(--muted);font-size:14px;margin-bottom:32px}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
  .summary-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
  .summary-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .summary-value{font-size:24px;font-weight:700;font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
  .summary-value.win{color:var(--green)}
  .summary-value.loss{color:var(--red)}
  .summary-value.pending{color:var(--butter)}

  .markets{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .market{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;transition:all .15s}
  .market.winnable{border-color:var(--green)}
  .market.winnable:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(63,185,80,.2)}
  .market-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
  .market-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase}
  .status-open{background:var(--green-bg);color:var(--green)}
  .status-settled{background:var(--blue-bg);color:var(--blue)}
  .status-resolved{background:var(--orange-bg);color:var(--orange)}
  .market-question{font-size:15px;font-weight:600;margin-bottom:16px;line-height:1.4;min-height:44px}
  .market-details{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .detail-row{display:flex;justify-content:space-between;font-size:13px}
  .detail-label{color:var(--muted)}
  .detail-value{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600}

  .btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:all .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
  .btn-claim{background:var(--green);color:#fff}
  .btn-pending{background:var(--panel2);color:var(--muted);cursor:not-allowed}
  .btn-claimed{background:var(--blue-bg);color:var(--blue);cursor:not-allowed}

  .empty{text-align:center;padding:80px 20px;color:var(--muted)}
  .empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}

  .tx-result{margin-top:16px;padding:16px;background:var(--green-bg);border:1px solid var(--green);border-radius:8px;text-align:center;display:none}
  .tx-result.show{display:block}
  .tx-result a{color:var(--green);text-decoration:underline}

  .loading{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<div class="header">
  <a class="back" href="index.html">← Back to Markets</a>
  <span class="balance" id="balance">—</span>
</div>

<div class="content">
  <div class="page-title">Claim Winnings</div>
  <div class="page-sub">View your positions and claim winnings from settled markets.</div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-label">Total Winnings</div>
      <div class="summary-value win" id="totalWon">+0.00 GEN</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Total Losses</div>
      <div class="summary-value loss" id="totalLost">-0.00 GEN</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Claimable</div>
      <div class="summary-value pending" id="totalClaimable">0.00 GEN</div>
    </div>
  </div>

  <div id="marketsList">
    <div class="loading">Loading your positions...</div>
  </div>

  <div class="tx-result" id="txResult">
    <div>✅ Winnings claimed!</div>
    <div style="margin-top:8px"><a id="txLink" href="#" target="_blank">View on Explorer</a></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script>
const FACTORY = "0xDD457e0F2FfE7B843f8C90f7997DB06714666CC9";
const RPC = "https://rpc-bradbury.genlayer.com";
const EXPLORER = "https://explorer-bradbury.genlayer.com/tx/";

const ABI = [
  "function claim(string marketId) returns (uint256)",
  "function getMarket(string marketId) view returns (bool exists, string marketId, string creator, string question, string rules, string marketType, string[] options, string source1, string status, string outcome, uint256 totalPool)",
  "function getConfig() view returns (uint256 marketCount)",
];

let provider = null, signer = null, contract = null, isConnected = false, address = null;
let positions = [];

async function checkConnection(){
  if(!window.ethereum) return;
  try {
    const accounts = await window.ethereum.request({method:"eth_accounts"});
    if(accounts && accounts.length > 0){
      isConnected = true;
      address = accounts[0];
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      contract = new ethers.Contract(FACTORY, ABI, signer);
      const bal = await provider.getBalance(address);
      document.getElementById('balance').textContent = parseFloat(ethers.formatEther(bal)).toFixed(4)+' GEN';
      await loadPositions();
    } else {
      document.getElementById('marketsList').innerHTML = '<div class="empty"><div class="empty-icon">🔗</div><div>Connect wallet to view positions</div></div>';
    }
  } catch(e) {
    console.error("Connection error:", e);
    document.getElementById('marketsList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div>Error connecting: '+e.message+'</div></div>';
  }
}

async function loadPositions(){
  if(!contract) return;
  try {
    // Get total markets
    const config = await contract.getConfig();
    const totalMarkets = Number(config.marketCount);
    
    positions = [];
    let totalWon = 0, totalLost = 0, totalClaimable = 0;

    // Check each market for user positions
    for(let i = 1; i <= totalMarkets; i++){
      const marketId = `market-${i}`;
      try {
        const market = await contract.getMarket(marketId);
        if(!market.exists) continue;
        
        // Check if user has positions (read from contract storage would be ideal, but we try-catch claim)
        // For now, show all settled/resolved markets
        if(market.status === 'SETTLED' || market.status === 'RESOLVED'){
          positions.push({
            marketId,
            question: market.question,
            status: market.status,
            outcome: market.outcome,
            totalPool: Number(ethers.formatEther(market.totalPool)),
          });
        }
      } catch(e) {
        // Skip markets that error
      }
    }

    renderPositions();
  } catch(e) {
    console.error("Load error:", e);
    document.getElementById('marketsList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div>Error loading positions: '+e.message+'</div></div>';
  }
}

function renderPositions(){
  const el = document.getElementById('marketsList');
  if(positions.length === 0){
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>No positions found</div><div style="font-size:12px;margin-top:8px">Stake on markets to see them here</div></div>';
    return;
  }

  el.innerHTML = positions.map(m => `
    <div class="market ${m.status === 'SETTLED' ? 'winnable' : ''}">
      <div class="market-header">
        <span class="market-status status-${m.status.toLowerCase()}">${m.status}</span>
      </div>
      <div class="market-question">${m.question}</div>
      <div class="market-details">
        <div class="detail-row">
          <span class="detail-label">Outcome</span>
          <span class="detail-value" style="color:var(--green)">${m.outcome || 'Pending'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Pool</span>
          <span class="detail-value">${m.totalPool.toFixed(2)} GEN</span>
        </div>
      </div>
      ${m.status === 'SETTLED' ? `
        <button class="btn btn-claim" onclick="claim('${m.marketId}', this)">Claim Winnings</button>
      ` : `
        <button class="btn btn-pending" disabled>Claim after settlement</button>
      `}
    </div>
  `).join('');

  // Update summary
  document.getElementById('totalClaimable').textContent = positions.filter(p => p.status === 'SETTLED').length + ' markets';
}

async function claim(marketId, btn){
  if(!isConnected) return alert('Please connect your wallet first');
  try {
    btn.disabled = true;
    btn.textContent = 'Claiming...';
    const tx = await contract.claim(marketId);
    const receipt = await tx.wait();
    document.getElementById('txResult').classList.add('show');
    document.getElementById('txLink').href = EXPLORER + tx.hash;
    btn.textContent = 'Claimed ✓';
    btn.className = 'btn btn-claimed';
  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Claim Winnings';
  }
}

// Initialize
checkConnection();
</script>
</body>
</html>
