<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GenLayer Prediction Market Resolver</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0b0e14; color: #e8ecf1; margin: 0; padding: 24px; line-height: 1.5; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: #9aa4b2; margin: 0 0 20px; }
  .card { background: #131824; border: 1px solid #222a3a; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  label { font-size: .8rem; color: #9aa4b2; display: block; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1; min-width: 240px; background: #0b0e14; border: 1px solid #2a3346; color: #e8ecf1; border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
  button { background: #4c7dff; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
  button:hover { background: #3a6bf0; }
  h2 { font-size: 1.15rem; margin: 0 0 6px; }
  h3 { margin: 0 0 12px; }
  .muted { color: #9aa4b2; }
  .kv { margin: 12px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; }
  .badge.ok { background: #10391f; color: #4ade80; }
  .badge.no { background: #3a1414; color: #f87171; }
  .badge.warn { background: #3a2f10; color: #facc15; }
  .badge.muted2 { background: #1c2432; color: #9aa4b2; }
  .rat { background: #0b0e14; border-left: 3px solid #4c7dff; padding: 8px 12px; border-radius: 6px; color: #c7d0dc; }
  .src ul { margin: 6px 0 0; padding-left: 18px; }
  .src a { color: #8ab4ff; word-break: break-all; }
  .timeline { display: flex; flex-direction: column; gap: 12px; }
  .tl { border: 1px solid #222a3a; border-radius: 10px; padding: 12px; background: #0f1420; }
  .tlh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .tlnote { margin-top: 6px; color: #c7d0dc; font-style: italic; }
  .tlby { margin-top: 4px; font-size: .78rem; word-break: break-all; }
  .foot { color: #6b7686; font-size: .82rem; margin-top: 8px; }
  .foot a { color: #8ab4ff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 Prediction Market Resolver</h1>
  <p class="sub">GenLayer Intelligent Contract on Bradbury testnet — resolves markets from cited sources by AI-validator consensus, with a dispute workflow and immutable on-chain history.</p>
  <div class="card">
    <label>Contract address</label>
    <div class="row">
      <input id="addr" value="0x5853abFE0CBF83ac65cd3DACFB35Bb1B0314C969" />
      <button id="load">Load market</button>
    </div>
    <div id="status" class="muted" style="margin-top:10px;">Idle.</div>
  </div>
  <div id="out"></div>
  <p class="foot">Read-only view via genlayer-js · Explorer: <a href="https://explorer-bradbury.genlayer.com" target="_blank" rel="noopener">explorer-bradbury.genlayer.com</a></p>
</div>
<script type="module">
import { createClient } from "https://esm.sh/genlayer-js";
import { testnetBradbury } from "https://esm.sh/genlayer-js/chains";

const client = createClient({ chain: testnetBradbury });
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const badge = (t, c) => '<span class="badge ' + c + '">' + esc(t) + '</span>';
function outcomeClass(o) { o = (o || "").toString().toUpperCase(); if (o === "YES") return "ok"; if (o === "NO") return "no"; if (o === "UNRESOLVED") return "warn"; return "muted2"; }

async function load() {
  const addr = el("addr").value.trim();
  el("status").textContent = "Loading " + addr + " ...";
  el("out").innerHTML = "";
  try {
    const s = await client.readContract({ address: addr, functionName: "get_state", args: [] });
    render(s);
    el("status").textContent = "Loaded.";
  } catch (e) {
    el("status").textContent = "Error: " + (e && e.message ? e.message : e);
  }
}

function render(s) {
  let hist = [];
  try { hist = JSON.parse(s.history || "[]"); } catch (e) {}
  let html = "";
  html += '<div class="card">';
  html += "<h2>" + esc(s.question) + "</h2>";
  html += '<p class="muted">' + esc(s.rules) + "</p>";
  html += '<div class="kv">Status: ' + badge(s.status || "-", s.status === "resolved" ? "ok" : "muted2") + " Outcome: " + badge(s.outcome || "-", outcomeClass(s.outcome)) + "</div>";
  if (s.rationale) html += '<p class="rat">' + esc(s.rationale) + "</p>";
  const srcs = [s.source1, s.source2, s.source3].filter(Boolean);
  if (srcs.length) {
    html += '<div class="src"><b>Sources</b><ul>';
    for (const u of srcs) html += '<li><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + "</a></li>";
    html += "</ul></div>";
  }
  html += "</div>";
  html += '<div class="card"><h3>Resolution history</h3>';
  if (!hist.length) {
    html += '<p class="muted">No resolutions yet.</p>';
  } else {
    html += '<div class="timeline">';
    for (const it of hist) {
      html += '<div class="tl">';
      html += '<div class="tlh">Round ' + esc(it.round) + " " + badge(it.kind, it.kind === "dispute" ? "warn" : "ok") + " &rarr; " + badge(it.outcome, outcomeClass(it.outcome)) + "</div>";
      if (it.note) html += '<div class="tlnote">&ldquo;' + esc(it.note) + "&rdquo;</div>";
      html += '<div class="tlby muted">by ' + esc(it.by) + "</div>";
      html += "</div>";
    }
    html += "</div>";
  }
  html += "</div>";
  el("out").innerHTML = html;
}

el("load").addEventListener("click", load);
load();
</script>
</body>
</html>
