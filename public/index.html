<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PrimeX — GenLayer Prediction Markets</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;--butter:#e8c98a;--text:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#f85149;--blue:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--butter),#c9a86a);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--bg);font-size:20px}
  .logo-text{font-size:22px;font-weight:700}
  .logo-badge{font-size:10px;background:var(--blue);color:#fff;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:8px}
  .nav{display:flex;align-items:center;gap:20px}
  .nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
  .nav a:hover{color:var(--text)}
  .addr{font-size:13px;color:var(--butter);font-family:monospace}
  .btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--butter);color:var(--bg)}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;font-size:13px;border-radius:6px;cursor:pointer}
  .hero{padding:60px 0;text-align:center}
  .hero h1{font-size:42px;font-weight:800;margin:0 0 16px}
  .hero p{font-size:18px;color:var(--muted);max-width:600px;margin:0 auto 32px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center}
  .stat-value{font-size:28px;font-weight:700;color:var(--butter)}
  .stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .section{margin-bottom:40px}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .section-title{font-size:24px;font-weight:700}
  .markets{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .market{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;transition:border-color .15s}
  .market:hover{border-color:var(--blue)}
  .market-q{font-size:16px;font-weight:600;margin-bottom:12px;line-height:1.4}
  .market-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase}
  .badge.OPEN{background:#0d2818;color:var(--green)}
  .badge.RESOLVED{background:#0d1a2d;color:var(--blue)}
  .badge.SETTLED{background:#2d1a0d;color:var(--butter)}
  .badge.DISPUTED{background:#2d0a0a;color:var(--red)}
  .market-pool{font-family:monospace;font-weight:600;color:var(--text)}
  .empty{text-align:center;padding:60px;color:var(--muted)}
  .empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}
  @media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:28px}.markets{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-icon">P</div>
      <span class="logo-text">PrimeX</span>
      <span class="logo-badge">GenLayer</span>
    </div>
    <div class="nav">
      <a href="#" onclick="viewMarkets()">Markets</a>
      <a href="#" onclick="createMarket()">Create</a>
      <a href="#" onclick="viewLeaderboard()">Leaderboard</a>
      <span class="addr" id="addr">Not connected</span>
      <button class="btn btn-outline" id="connectBtn" onclick="connect()">Connect Wallet</button>
    </div>
  </header>

  <section class="hero">
    <h1>Predict the Future</h1>
    <p>AI-powered prediction markets on GenLayer. Stake GEN on outcomes, verified by decentralized consensus.</p>
    <button class="btn btn-primary" onclick="createMarket()">Create Market</button>
  </section>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="totalMarkets">0</div><div class="stat-label">Total Markets</div></div>
    <div class="stat"><div class="stat-value" id="totalVolume">0</div><div class="stat-label">Total Volume (GEN)</div></div>
    <div class="stat"><div class="stat-value" id="activeMarkets">0</div><div class="stat-label">Active Markets</div></div>
    <div class="stat"><div class="stat-value" id="resolvedMarkets">0</div><div class="stat-label">Resolved</div></div>
  </div>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">Active Markets</h2>
      <button class="btn btn-outline" onclick="viewMarkets()">View All</button>
    </div>
    <div class="markets" id="marketsList">
      <div class="empty"><div class="empty-icon">📊</div><div>Loading markets...</div></div>
    </div>
  </section>
</div>

<script type="module" src="app.bundle.js"></script>
</body>
</html>
