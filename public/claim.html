<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PrimeX — Claim Winnings</title>
<style>
  :root{
    --bg:#0a0e14;--panel:#111820;--panel2:#1a2230;--border:#2a3540;
    --butter:#e8c98a;--text:#e6edf3;--muted:#7a8a9a;
    --green:#3fb950;--green-bg:#0d2818;
    --red:#f85149;--red-bg:#2d0a0a;
    --blue:#58a6ff;--blue-bg:#0d1a2d;
    --orange:#f0883e;--orange-bg:#2d1a0d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}

  .header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:none}
  .back:hover{color:var(--text)}
  .balance{font-size:13px;color:var(--green);font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600}

  .content{max-width:800px;margin:0 auto;padding:24px}

  .page-title{font-size:28px;font-weight:700;margin-bottom:8px}
  .page-sub{color:var(--muted);font-size:14px;margin-bottom:32px}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
  .summary-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
  .summary-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .summary-value{font-size:24px;font-weight:700;font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace}
  .summary-value.win{color:var(--green)}
  .summary-value.loss{color:var(--red)}
  .summary-value.pending{color:var(--butter)}

  .markets{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .market{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;transition:all .15s}
  .market.winnable{border-color:var(--green)}
  .market.winnable:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(63,185,80,.2)}
  .market-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
  .market-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase}
  .status-open{background:var(--green-bg);color:var(--green)}
  .status-settled{background:var(--blue-bg);color:var(--blue)}
  .status-resolved{background:var(--orange-bg);color:var(--orange)}
  .market-question{font-size:15px;font-weight:600;margin-bottom:16px;line-height:1.4;min-height:44px}
  .market-details{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .detail-row{display:flex;justify-content:space-between;font-size:13px}
  .detail-label{color:var(--muted)}
  .detail-value{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600}

  .btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:all .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
  .btn-claim{background:var(--green);color:#fff}
  .btn-pending{background:var(--panel2);color:var(--muted);cursor:not-allowed}
  .btn-claimed{background:var(--blue-bg);color:var(--blue);cursor:not-allowed}

  .empty{text-align:center;padding:80px 20px;color:var(--muted)}
  .empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}

  .tx-result{margin-top:16px;padding:16px;background:var(--green-bg);border:1px solid var(--green);border-radius:8px;text-align:center;display:none}
  .tx-result.show{display:block}
  .tx-result a{color:var(--green);text-decoration:underline}

  .loading{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<div class="header">
  <a class="back" href="index.html">← Back to Markets</a>
  <span class="balance" id="balance">—</span>
</div>

<div class="content">
  <div class="page-title">Claim Winnings</div>
  <div class="page-sub">View your positions and claim winnings from settled markets.</div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-label">Total Winnings</div>
      <div class="summary-value win" id="totalWon">+0.00 GEN</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Total Losses</div>
      <div class="summary-value loss" id="totalLost">-0.00 GEN</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Claimable</div>
      <div class="summary-value pending" id="totalClaimable">0.00 GEN</div>
    </div>
  </div>

  <div id="marketsList">
    <div class="loading">Loading your positions...</div>
  </div>

  <div class="tx-result" id="txResult">
    <div>✅ Winnings claimed!</div>
    <div style="margin-top:8px"><a id="txLink" href="#" target="_blank">View on Explorer</a></div>
  </div>
</div>

<button class="btn" id="connectBtn" onclick="doConnect()"
        style="width:100%;padding:14px;border:0;border-radius:10px;background:#58a6ff;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:20px;font-family:inherit">
  Connect Wallet
</button>

<!-- Real on-chain data via genlayer-js. Never call GenLayer contracts with
     ethers/viem aimed at the contract address — calls must route through
     ConsensusMain. See genlayer-client.js. -->
<script type="module">
import * as gl from './gl-client.v3.js';

const $ = (id) => document.getElementById(id);
let positions = [];

window.doConnect = async () => {
  const btn = $('connectBtn');
  try {
    btn.textContent = 'Connecting…';
    const addr = await gl.connect();
    $('balance').textContent = (await gl.getBalance()).toFixed(4) + ' GEN';
    btn.textContent = addr.slice(0, 6) + '…' + addr.slice(-4);
    btn.disabled = true;
    await loadPositions();
  } catch (e) {
    btn.textContent = 'Connect Wallet';
    $('marketsList').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div>${e.message}</div></div>`;
  }
};

async function loadPositions() {
  const me = (gl.getAddress() || '').toLowerCase();
  $('marketsList').innerHTML = '<div class="loading">Reading your positions from chain…</div>';

  try {
    const markets = await gl.loadMarkets();
    positions = [];

    for (const m of markets) {
      // Sum this wallet's stake per side from the on-chain position list.
      let yes = 0, no = 0;
      for (const h of m.holders) {
        if ((h.address || '').toLowerCase() !== me) continue;
        if (h.side === 'YES') yes += h.amount; else if (h.side === 'NO') no += h.amount;
      }
      if (yes === 0 && no === 0) continue;

      const staked = yes + no;
      let payout = 0, state = 'open';

      if (m.status === 'SETTLED' || m.status === 'RESOLVED') {
        const won = m.outcome === 'YES' ? yes : m.outcome === 'NO' ? no : 0;
        const winningPool = m.outcome === 'YES' ? m.yes : m.no;
        payout = winningPool > 0 ? (won * m.pool) / winningPool : 0;
        state = won > 0 ? (m.status === 'SETTLED' ? 'claimable' : 'won') : 'lost';
      }
      positions.push({ ...m, yesStake: yes, noStake: no, staked, payout, state });
    }
    render();
  } catch (e) {
    $('marketsList').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div>Could not read positions: ${e.message}</div></div>`;
  }
}

function render() {
  const el = $('marketsList');

  if (!positions.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>No positions yet</div>' +
      '<div style="font-size:12px;margin-top:8px">Stake on a market and it will appear here</div></div>';
    $('totalWon').textContent = '+0.00 GEN';
    $('totalLost').textContent = '-0.00 GEN';
    $('totalClaimable').textContent = '0.00 GEN';
    return;
  }

  let won = 0, lost = 0, claimable = 0;
  for (const p of positions) {
    if (p.state === 'claimable') { claimable += p.payout; won += Math.max(p.payout - p.staked, 0); }
    else if (p.state === 'won') won += Math.max(p.payout - p.staked, 0);
    else if (p.state === 'lost') lost += p.staked;
  }
  $('totalWon').textContent = '+' + won.toFixed(2) + ' GEN';
  $('totalLost').textContent = '-' + lost.toFixed(2) + ' GEN';
  $('totalClaimable').textContent = claimable.toFixed(2) + ' GEN';

  el.innerHTML = positions.map(p => {
    const sides = [
      p.yesStake > 0 ? `YES ${p.yesStake.toFixed(2)}` : null,
      p.noStake > 0 ? `NO ${p.noStake.toFixed(2)}` : null,
    ].filter(Boolean).join(' · ');

    let action = '';
    if (p.state === 'claimable') {
      action = `<button onclick="doClaim('${p.id}')" id="btn-${p.id}"
        style="width:100%;padding:12px;border:0;border-radius:8px;background:#3fb950;color:#fff;
        font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px">
        Claim ${p.payout.toFixed(2)} GEN</button>`;
    } else if (p.state === 'lost') {
      action = `<div style="margin-top:12px;font-size:13px;color:#f85149">Outcome ${p.outcome} — position lost</div>`;
    } else if (p.state === 'won') {
      action = `<div style="margin-top:12px;font-size:13px;color:#7a8a9a">Resolved ${p.outcome} — awaiting settlement</div>`;
    } else {
      action = `<div style="margin-top:12px;font-size:13px;color:#7a8a9a">Market still open</div>`;
    }

    return `
      <div style="background:#111820;border:1px solid #2a3540;border-radius:12px;padding:20px;margin-bottom:16px">
        <div style="font-weight:700;font-size:16px;margin-bottom:10px">${p.question}</div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#7a8a9a;margin-bottom:6px">
          <span>Your position</span><span style="color:#e6edf3;font-family:ui-monospace,monospace">${sides}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#7a8a9a;margin-bottom:6px">
          <span>Total staked</span><span style="color:#e6edf3;font-family:ui-monospace,monospace">${p.staked.toFixed(2)} GEN</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#7a8a9a">
          <span>Market pool · status</span>
          <span style="color:#e8c98a;font-family:ui-monospace,monospace">${p.pool.toFixed(2)} GEN · ${p.status}</span>
        </div>
        ${action}
      </div>`;
  }).join('');
}

window.doClaim = async (marketId) => {
  const btn = $('btn-' + marketId);
  const original = btn ? btn.textContent : '';
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Confirm in wallet… (~30-60s)'; }
    const { hash } = await gl.claim(marketId);

    const res = $('txResult');
    res.style.display = 'block';
    res.innerHTML =
      `<div>✅ Claim recorded on chain for ${marketId}</div>` +
      `<div style="margin-top:8px;font-family:ui-monospace,monospace;font-size:11px;word-break:break-all">${hash}</div>` +
      `<div style="margin-top:8px"><a href="${gl.EXPLORER_TX}${hash}" target="_blank" rel="noopener">View on Explorer</a></div>`;

    $('balance').textContent = (await gl.getBalance()).toFixed(4) + ' GEN';
    await loadPositions();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = original; }
    const res = $('txResult');
    res.style.display = 'block';
    res.style.background = '#2d0a0a';
    res.style.borderColor = '#f85149';
    res.innerHTML = `<div style="color:#f85149">❌ ${e.message}</div>`;
  }
};

$('marketsList').innerHTML =
  '<div class="empty"><div class="empty-icon">🔗</div><div>Connect your wallet to view positions</div></div>';
</script>
</body>
</html>
