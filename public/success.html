<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PrimeX — Stake Confirmed</title>
<style>
  :root{
    --bg:#0a0e14;--panel:#111820;--panel2:#1a2230;--border:#2a3540;
    --butter:#e8c98a;--text:#e6edf3;--muted:#7a8a9a;
    --green:#3fb950;--green-bg:#0d2818;
    --red:#f85149;--red-bg:#2d0a0a;
    --blue:#58a6ff;--blue-bg:#0d1a2d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}

  .header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:none}
  .back:hover{color:var(--text)}
  .balance{font-size:13px;color:var(--green);font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600}

  .content{max-width:600px;margin:0 auto;padding:24px;text-align:center}

  .success-icon{width:80px;height:80px;border-radius:50%;background:var(--green-bg);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 24px}
  .success-title{font-size:24px;font-weight:700;margin-bottom:8px;color:var(--green)}
  .success-sub{font-size:14px;color:var(--muted);margin-bottom:32px}

  .details{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;text-align:left}
  .detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
  .detail-row:last-child{border-bottom:none}
  .detail-label{color:var(--muted)}
  .detail-value{font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;font-weight:600}

  .tx-hash{background:var(--panel2);border-radius:8px;padding:12px;font-size:11px;font-family:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;word-break:break-all;margin-bottom:24px;cursor:pointer;text-align:left;border:1px solid var(--blue)}
  .tx-label{font-size:11px;color:var(--blue);margin-bottom:4px;font-weight:600}
  .tx-hash:hover{background:var(--border)}

  .btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;padding:10px 20px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none}
  .btn:hover{filter:brightness(1.1)}
  .btn-primary{background:var(--butter);color:var(--bg);width:100%;margin-bottom:12px}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;font-size:13px;border-radius:6px;cursor:pointer;width:100%}

  .explainer{font-size:11px;color:var(--muted);margin-top:24px;padding:12px;background:var(--panel2);border-radius:8px;text-align:left}
</style>
</head>
<body>
<div class="header">
  <a class="back" onclick="history.back()">← Back to Stake</a>
  <span class="balance" id="balance">—</span>
</div>

<div class="content">
  <div class="success-icon">✓</div>
  <div class="success-title">Stake Confirmed!</div>
  <div class="success-sub">Your prediction has been placed on-chain.</div>

  <div class="tx-hash" onclick="copyTx()">
    <div class="tx-label">Transaction Hash (tap to copy)</div>
    <div id="txHash">—</div>
  </div>

  <div class="details">
    <div class="detail-row"><span class="detail-label">Market</span><span class="detail-value" id="mQuestion">—</span></div>
    <div class="detail-row"><span class="detail-label">Side</span><span class="detail-value" id="mSide">—</span></div>
    <div class="detail-row"><span class="detail-label">Amount</span><span class="detail-value" id="mAmount">—</span></div>
    <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value" style="color:var(--green)">Confirmed</span></div>
  </div>

  <a class="btn btn-primary" href="index.html">Back to Markets</a>
  <a class="btn btn-outline" onclick="copyTx()">Copy Transaction Hash</a>

  <div class="explainer">
    <strong>Note:</strong> This transaction is recorded on the GenLayer Bradbury testnet. You can verify it on the explorer.
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
document.getElementById('mQuestion').textContent = params.get('q') || '—';
document.getElementById('mSide').textContent = params.get('side') || '—';
document.getElementById('mAmount').textContent = (params.get('amt') || '0') + ' GEN';
document.getElementById('txHash').textContent = params.get('tx') || '—';

function copyTx(){
  const tx = document.getElementById('txHash').textContent;
  navigator.clipboard.writeText(tx);
  alert('Transaction hash copied!');
}
</script>
</body>
</html>
